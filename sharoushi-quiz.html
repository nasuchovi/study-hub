<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>社労士 択一トレーニング｜労働基準法</title>
<style>
  :root{
    --paper:#FCFBF7;
    --ink:#23272F;
    --sub:#6B6F78;
    --line:#DCD8CD;
    --shu:#BC342C;        /* 朱：採点の赤 */
    --marker:#FFE76A;     /* 蛍光ペン */
    --marker-soft:#FFF3B8;
    --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","BIZ UDMincho",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","BIZ UDGothic",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.75;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 96px;}

  /* ─── 試験用紙ふうヘッダー ─── */
  header{
    border-bottom:2px solid var(--ink);
    padding:20px 0 12px;
    margin-bottom:4px;
  }
  .exam-label{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.22em;
    color:var(--sub);
  }
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:21px;
    letter-spacing:.06em;
    margin-top:2px;
  }
  .subject-tag{
    display:inline-block;
    font-size:12px;
    border:1px solid var(--ink);
    padding:1px 10px;
    margin-top:8px;
    letter-spacing:.15em;
  }

  /* ─── ホーム ─── */
  .stats{
    display:flex;
    border:1px solid var(--line);
    background:#fff;
    margin:20px 0 16px;
  }
  .stat{
    flex:1;
    text-align:center;
    padding:14px 4px 12px;
  }
  .stat + .stat{border-left:1px solid var(--line);}
  .stat .num{
    font-family:var(--serif);
    font-size:26px;
    font-weight:700;
    line-height:1.2;
  }
  .stat .num .unit{font-size:13px;font-weight:400;margin-left:1px;}
  .stat .lbl{font-size:11px;color:var(--sub);letter-spacing:.1em;}

  .menu-btn{
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid var(--ink);
    padding:16px 18px;
    margin-bottom:12px;
    font-family:var(--sans);
    font-size:16px;
    color:var(--ink);
    cursor:pointer;
    position:relative;
  }
  .menu-btn:active{background:var(--marker-soft);}
  .menu-btn .desc{display:block;font-size:12px;color:var(--sub);margin-top:2px;}
  .menu-btn:after{
    content:"→";
    position:absolute;
    right:16px;top:50%;
    transform:translateY(-50%);
    color:var(--sub);
  }
  .menu-btn.disabled{opacity:.4;pointer-events:none;}
  .reset-link{
    display:block;
    margin:22px auto 0;
    background:none;border:none;
    font-size:12px;color:var(--sub);
    text-decoration:underline;
    cursor:pointer;
  }
  .note{
    font-size:12px;color:var(--sub);
    border-top:1px dashed var(--line);
    margin-top:26px;padding-top:12px;
  }

  /* ─── 出題画面 ─── */
  .q-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:18px 0 6px;
  }
  .q-no{
    font-family:var(--serif);
    font-weight:700;
    font-size:20px;
  }
  .q-prog{font-size:12px;color:var(--sub);letter-spacing:.08em;}
  .q-text{
    font-family:var(--serif);
    font-size:16.5px;
    line-height:2;
    margin-bottom:18px;
    text-align:justify;
    white-space:pre-line;
  }
  .choices{list-style:none;}
  .choice{
    display:flex;
    gap:12px;
    border:1px solid var(--line);
    background:#fff;
    padding:13px 14px;
    margin-bottom:10px;
    cursor:pointer;
    position:relative;
    font-family:var(--serif);
    font-size:15px;
    line-height:1.85;
    text-align:justify;
  }
  .choice:active{background:var(--marker-soft);}
  .choice .alpha{
    font-family:var(--serif);
    font-weight:700;
    flex-shrink:0;
  }
  .choice.locked{cursor:default;}
  .choice.picked{background:var(--marker);border-color:var(--ink);}
  .choice.dim{opacity:.55;}

  /* 採点マーク（朱） */
  .mark{
    position:absolute;
    top:-14px;left:-10px;
    width:42px;height:42px;
    pointer-events:none;
  }
  .mark svg{width:100%;height:100%;}
  .mark .stroke{
    stroke:var(--shu);
    stroke-width:5;
    fill:none;
    stroke-linecap:round;
    stroke-dasharray:200;
    stroke-dashoffset:200;
    animation:draw .45s ease forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}
  @media (prefers-reduced-motion: reduce){
    .mark .stroke{animation:none;stroke-dashoffset:0;}
  }

  /* 判定バナー */
  .verdict{
    font-family:var(--serif);
    font-weight:700;
    font-size:18px;
    color:var(--shu);
    border:2px solid var(--shu);
    display:inline-block;
    padding:2px 16px;
    margin:6px 0 14px;
    letter-spacing:.2em;
  }
  .kaisetsu{
    border-top:2px solid var(--ink);
    padding-top:12px;
    margin-top:4px;
  }
  .point-box{
    background:var(--marker-soft);
    border-left:4px solid var(--marker);
    padding:12px 14px;
    margin:4px 0 18px;
  }
  .point-box h3{
    font-size:12px;
    letter-spacing:.2em;
    font-weight:700;
    color:var(--ink);
    margin-bottom:6px;
  }
  .point-box p{
    font-size:13.5px;
    line-height:1.9;
    text-align:justify;
  }
  .kaisetsu h3{
    font-size:13px;
    letter-spacing:.2em;
    color:var(--sub);
    font-weight:600;
    margin-bottom:8px;
  }
  .kai-item{
    font-size:13.5px;
    line-height:1.8;
    margin-bottom:8px;
    padding-left:1.6em;
    text-indent:-1.6em;
  }
  .kai-item b{font-family:var(--serif);}
  .kai-item .ox{color:var(--shu);font-weight:700;margin-right:4px;}

  .next-bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--paper);
    border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  }
  .next-bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px;}
  .btn{
    flex:1;
    font-family:var(--sans);
    font-size:16px;
    padding:14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
    letter-spacing:.1em;
  }
  .btn.ghost{background:#fff;color:var(--ink);flex:0 0 auto;padding:14px 16px;}
  .btn:active{opacity:.8;}

  /* ─── 結果 ─── */
  .result-circle{
    text-align:center;
    margin:34px 0 10px;
  }
  .result-circle .big{
    font-family:var(--serif);
    font-size:52px;
    font-weight:700;
    color:var(--shu);
    line-height:1;
  }
  .result-circle .big .small{font-size:20px;color:var(--ink);}
  .result-circle .cap{font-size:12px;color:var(--sub);letter-spacing:.15em;margin-top:6px;}
  .result-list{margin:22px 0;border-top:1px solid var(--line);}
  .result-row{
    display:flex;gap:10px;
    padding:10px 2px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    align-items:baseline;
  }
  .result-row .ox{font-family:var(--serif);font-weight:700;color:var(--shu);flex-shrink:0;width:1.4em;}
  .result-row .ttl{color:var(--ink);}
  .loading{
    text-align:center;
    color:var(--sub);
    font-size:13px;
    padding:60px 0;
    letter-spacing:.2em;
  }
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="exam-label">社会保険労務士試験対策｜択一式トレーニング</div>
    <h1>択一式 全科目演習</h1>
    <span class="subject-tag">全10科目110問＋第57回本試験20問</span>
  </header>

  <div id="screen-loading" class="loading">読み込み中…</div>

  <!-- ホーム -->
  <div id="screen-home" class="hidden">
    <div class="stats">
      <div class="stat"><div class="num" id="st-answered">0<span class="unit">問</span></div><div class="lbl">解答済み</div></div>
      <div class="stat"><div class="num" id="st-rate">–<span class="unit">%</span></div><div class="lbl">直近正答率</div></div>
      <div class="stat"><div class="num" id="st-wrong">0<span class="unit">問</span></div><div class="lbl">要復習</div></div>
    </div>
    <div id="cat-menu"></div>
    <button class="menu-btn" id="btn-review">間違えた問題だけ解く<span class="desc">全範囲から、直近で×だった問題を復習</span></button>
    <button class="menu-btn" id="btn-random">ランダムに10問<span class="desc">全範囲シャッフル。通勤・休憩中のひと回しに</span></button>
    <button class="reset-link" id="btn-reset">成績データをリセットする</button>
    <p class="note">本試験と同じ「正しいものを1つ選ぶ」5肢択一形式です。問題はClaudeが作成した演習用オリジナル問題で、成績はこの端末のあなた専用データとして保存されます。</p>
  </div>

  <!-- 出題 -->
  <div id="screen-quiz" class="hidden">
    <div class="q-head">
      <div class="q-no" id="q-no">問 1</div>
      <div class="q-prog" id="q-prog">1 / 10</div>
    </div>
    <p class="q-text" id="q-text"></p>
    <ul class="choices" id="choices"></ul>
    <div id="feedback" class="hidden">
      <div class="verdict" id="verdict">正解</div>
      <div class="point-box">
        <h3>この問題のポイント</h3>
        <p id="q-point"></p>
      </div>
      <div class="kaisetsu">
        <h3>各肢の解説</h3>
        <div id="kai-list"></div>
      </div>
    </div>
  </div>

  <!-- 結果 -->
  <div id="screen-result" class="hidden">
    <div class="result-circle">
      <div class="big"><span id="r-correct">0</span><span class="small"> / <span id="r-total">10</span> 問正解</span></div>
      <div class="cap" id="r-cap">採点結果</div>
    </div>
    <div class="result-list" id="r-list"></div>
  </div>
</div>

<div class="next-bar hidden" id="next-bar">
  <div class="inner">
    <button class="btn ghost" id="btn-quit">中断</button>
    <button class="btn" id="btn-next">次の問題へ</button>
  </div>
</div>
<div class="next-bar hidden" id="result-bar">
  <div class="inner">
    <button class="btn ghost" id="btn-home2">ホームへ</button>
    <button class="btn" id="btn-retry-wrong">間違えた問題を解き直す</button>
  </div>
</div>

<script>
/* ───────── 問題データ（労働基準法・基礎10問） ───────── */
const QUESTIONS = [
{
 id:"rk01",
 title:"労働条件の原則",
 q:"労働基準法の総則に関する次の記述のうち、正しいものはどれか。",
 choices:[
  "労働条件は、労働者が人たるに値する生活を営むための必要を充たすべきものでなければならない。",
  "労働基準法で定める労働条件の基準は最低のものであるから、当事者間の合意があれば、これを下回る労働条件を定めることも許される。",
  "労働条件は、事業経営の責任を負う使用者が決定すべきものとされている。",
  "労働基準法第3条の均等待遇の規定は、国籍、信条、性別を理由とする労働条件についての差別的取扱いを禁止している。",
  "使用者は、労働契約の不履行について違約金を定める契約を締結することができる。"
 ],
 answer:0,
 kai:[
  "正しい。法1条1項のとおり。「人たるに値する生活」は選択式でも頻出の重要キーワード。",
  "誤り。基準に達しない労働条件を定める労働契約はその部分について無効となり、無効となった部分は法の基準による（法13条）。合意があっても下回れない。",
  "誤り。労働条件は、労働者と使用者が対等の立場において決定すべきもの（法2条1項）。",
  "誤り。法3条が掲げる事由は「国籍・信条・社会的身分」の3つ。性別は含まれない（賃金についてのみ法4条が男女差別を禁止）。ひっかけの超定番。",
  "誤り。賠償予定の禁止（法16条）。違約金の定めや損害賠償額の予定は禁止されている。"
 ]
},
{
 id:"rk02",
 title:"労働契約の期間",
 q:"労働契約の期間に関する次の記述のうち、正しいものはどれか。",
 choices:[
  "労働契約は、期間の定めのないものを除き、原則として5年を超える期間について締結してはならない。",
  "高度の専門的知識等を有する労働者との間に締結される労働契約（当該知識等を必要とする業務に就く場合）は、5年以内の期間で締結することができる。",
  "満60歳以上の労働者との間に締結される労働契約の期間の上限は、3年とされている。",
  "一定の事業の完了に必要な期間を定める労働契約であっても、3年を超える期間を定めることはできない。",
  "期間の定めのある労働契約は何回でも更新できるが、1回の契約期間は1年を超えてはならない。"
 ],
 answer:1,
 kai:[
  "誤り。原則の上限は3年（法14条1項）。5年は例外の場合の上限。",
  "正しい。高度の専門的知識等を有する労働者（その業務に就く場合）は上限5年（法14条1項1号）。",
  "誤り。満60歳以上の労働者との労働契約の上限は5年（法14条1項2号）。「3年か5年か」は数字ひっかけの定番。",
  "誤り。一定の事業の完了に必要な期間を定める契約（例：4年間の建設工事）は、その期間でよい。3年の制限を受けない。",
  "誤り。そのような規定はない。原則3年・例外5年の枠内であれば1回の期間が1年を超えても差し支えない。"
 ]
},
{
 id:"rk03",
 title:"解雇の予告",
 q:"解雇に関する次の記述のうち、正しいものはどれか。",
 choices:[
  "使用者は、労働者を解雇しようとする場合においては、少なくとも14日前にその予告をしなければならない。",
  "30日前に解雇の予告をしない使用者は、30日分以上の平均賃金を支払わなければならない。",
  "解雇予告の日数は、平均賃金を支払った日数分短縮することはできない。",
  "日々雇い入れられる者については、継続勤務の期間にかかわらず、解雇予告の規定は適用されない。",
  "労働者が業務上の傷病により休業する期間及びその後30日間であっても、解雇の予告をすれば解雇することができる。"
 ],
 answer:1,
 kai:[
  "誤り。予告は少なくとも30日前（法20条1項）。",
  "正しい。法20条1項のとおり。予告に代えて解雇予告手当（平均賃金の30日分以上）を支払う方法がある。",
  "誤り。予告の日数は、1日について平均賃金を支払った場合においては、その日数を短縮できる（法20条2項）。",
  "誤り。日々雇い入れられる者でも、1か月を超えて引き続き使用されるに至った場合は予告の規定が適用される（法21条）。",
  "誤り。業務上傷病の休業期間＋その後30日間は解雇制限期間であり、予告の有無にかかわらず原則として解雇できない（法19条）。"
 ]
},
{
 id:"rk04",
 title:"賃金支払の原則",
 q:"賃金の支払に関する次の記述のうち、正しいものはどれか。",
 choices:[
  "賃金は通貨で支払うことが原則であるが、労働者本人の同意を得れば、現物で支払うことができる。",
  "賃金は、労働者本人の同意があれば、その親権者その他の法定代理人に支払うことができる。",
  "賃金は、毎月1回以上、一定の期日を定めて支払わなければならない。",
  "年俸制を採用している場合には、賃金を年1回支払うこととしても差し支えない。",
  "賃金の一部を控除して支払うことは、いかなる場合も許されない。"
 ],
 answer:2,
 kai:[
  "誤り。通貨払いの例外（現物給与）が認められるのは、法令に別段の定めがある場合または労働協約に別段の定めがある場合。本人の同意では足りない。",
  "誤り。直接払いの原則。本人の同意があっても、親権者等の法定代理人への支払いは認められない。",
  "正しい。毎月1回以上・一定期日払いの原則（法24条2項）。",
  "誤り。年俸制であっても毎月1回以上払いの原則の適用を受けるため、分割して毎月支払う必要がある。",
  "誤り。法令に別段の定めがある場合（税金・社会保険料等）や、過半数労働組合または過半数代表者との書面協定がある場合は控除できる（法24条1項ただし書）。"
 ]
},
{
 id:"rk05",
 title:"労働時間・休憩・休日",
 q:"労働時間、休憩及び休日に関する次の記述のうち、正しいものはどれか。",
 choices:[
  "使用者は、労働者に、休憩時間を除き1週間について44時間を超えて労働させてはならないのが原則である。",
  "1日の法定労働時間の上限は、休憩時間を含めて8時間とされている。",
  "使用者は、労働時間が6時間を超える場合においては少なくとも45分、8時間を超える場合においては少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。",
  "休憩時間は、いかなる事業場においても、すべての労働者に一斉に与えなければならない。",
  "使用者は、労働者に対して、毎週少なくとも2回の休日を与えなければならない。"
 ],
 answer:2,
 kai:[
  "誤り。原則は週40時間（法32条1項）。44時間は特例措置対象事業場（常時10人未満の商業・映画演劇業等）の特例。",
  "誤り。「休憩時間を除き」1日8時間（法32条2項）。含む／除くのひっかけに注意。",
  "正しい。法34条1項のとおり。「6時間を超える→45分」「8時間を超える→1時間」。ちょうど6時間なら休憩不要、ちょうど8時間なら45分でよい点もセットで押さえる。",
  "誤り。一斉付与が原則だが、労使協定がある場合や運輸交通業・商業等の特例事業では一斉に与えなくてよい（法34条2項）。",
  "誤り。毎週少なくとも1回（法35条1項）。例外として4週間を通じ4日以上の変形休日制も認められる。"
 ]
},
{
 id:"rk06",
 title:"年次有給休暇",
 q:"年次有給休暇に関する次の記述のうち、正しいものはどれか。",
 choices:[
  "使用者は、雇入れの日から起算して6か月間継続勤務し全労働日の8割以上出勤した労働者に対して、10労働日の有給休暇を与えなければならない。",
  "年次有給休暇の付与要件である出勤率は、全労働日の7割以上とされている。",
  "年次有給休暇の付与日数は、継続勤務年数にかかわらず一律10労働日である。",
  "年次有給休暇を与える時季は、使用者が業務の都合により指定するのが原則である。",
  "労働者が業務上の傷病により休業した期間は、出勤率の算定上、欠勤として取り扱われる。"
 ],
 answer:0,

 rb08:"帳簿3点セット〈労働者名簿（日々雇用者を除く）／賃金台帳（全事業場・日々雇用者も記入）／記録の保存5年（当分の間3年）〉。「名簿は日雇い除く・台帳は日雇いも含む」の対比、「就業規則の10人」と「台帳は人数要件なし」の対比がひっかけどころ。",
 rb09:"41条の適用除外は〈農業・水産業〉〈管理監督者・機密事務取扱者〉〈監視・断続的労働（許可制）〉の3類型。除外されるのは「労働時間・休憩・休日」だけで、〈深夜（割増）と年休は適用あり〉が鉄板論点。「名ばかり管理職」の議論の根っこでもある。",
 rb10:"制裁の制限（91条）は数字2つ：〈1回＝平均賃金の1日分の半額以内〉〈総額＝一賃金支払期の賃金総額の10分の1以内〉。平均賃金（12条）を使う場面（解雇予告手当・休業手当・災害補償・減給制裁・年休の賃金）として横断整理すると記憶が定着する。",
 ae01:"安衛法は労基法から分離独立した法律（昭和47年制定）。目的条文のキーワード〈危害防止基準の確立・責任体制の明確化・自主的活動の促進〉〈安全と健康の確保＋快適な職場環境の形成の促進〉は選択式の超頻出。事業者の責務（3条）と労働者の協力義務（4条）もセットで。",
 ae02:"安全衛生管理体制は「誰を・何人規模で・いつまでに」の表を作るのが王道。総括安全衛生管理者は〈資格不要・統括管理者を充てる〉〈規模は業種3区分：100人／300人／1,000人〉。選任はすべて14日以内＋遅滞なく報告、で統一されている点を利用して覚える。",
 ae03:"〈安全管理者＝特定業種×50人以上〉〈衛生管理者＝全業種×50人以上〉の対比が軸。衛生管理者は規模に応じて必要人数が増える（200人超で2人…）こと、原則専属であることも頻出。第一種・第二種衛生管理者免許の業種制限は細かいが後で押さえる。",
 ae04:"産業医は〈全業種×50人以上〉〈医師＋研修等の要件〉〈専属：1,000人以上または有害業務500人以上〉〈2人以上：3,000人超〉。数字のセット（50・500・1,000・3,000）で覚える。産業医の勧告権・事業者の情報提供義務など近年の機能強化論点も出題が増えている。",
 ae05:"委員会は〈安全委員会＝特定業種×50人or100人以上〉〈衛生委員会＝全業種×50人以上〉〈両方→安全衛生委員会に統合可〉〈毎月1回以上開催・議事の概要を周知・重要な議事記録は3年保存〉。議長は総括安全衛生管理者等、委員の半数は過半数組合等の推薦に基づき指名、という構成も問われる。",
 ae06:"安全衛生教育は〈雇入れ時・作業内容変更時（59条1項・2項）＝全業種・全労働者・規模不問〉〈危険有害業務に就かせるときの特別教育（59条3項）〉〈職長教育（60条）＝特定業種〉の3層構造。教育は所定労働時間内が原則・費用は事業者負担、も定番。",
 ae07:"健康診断は〈雇入れ時（3か月以内受診＋証明書面で省略可）〉〈定期＝1年以内ごと〉〈特定業務従事者＝配置替えの際＋6か月以内ごと〉が基本形。結果の記録5年保存、意見聴取（3か月以内）、本人への通知、50人以上の事業場の定期健診結果報告、と事後措置の流れまで一連で覚える。",
 ae08:"ストレスチェック（66条の10）は〈50人以上＝義務（未満は当分の間努力義務）〉〈1年以内ごとに1回〉〈実施者＝医師・保健師等〉〈結果は本人同意なく事業者に提供不可〉〈高ストレス者の申出→医師の面接指導→不利益取扱い禁止〉。プライバシー保護の建付けが出題の中心。",
 ae09:"長時間労働の面接指導は3段階で整理：〈一般＝月80時間超＋疲労蓄積＋申出〉〈研究開発業務＝月100時間超で申出不要・義務〉〈高度プロフェッショナル＝週40時間超の健康管理時間が月100時間超で申出不要・義務〉。「80か100か」「申出が要るか」の組合せで問われる。",
 ae10:"資格関係は〈免許（都道府県労働局長）〉〈技能講習〉〈特別教育〉の3ランクで危険度順に整理。就業制限業務（61条）は無資格者×・立会いでも×・資格証携帯義務。作業主任者（14条）は免許者・技能講習修了者から選任し、安全管理者等の管理体制とは別系統であることに注意。",
 rs01:"労災保険は〈事業単位・当然適用・全額事業主負担・労働者の手続不要〉の4点が出発点。暫定任意適用事業（労働者5人未満の個人経営の農林水産の一部）だけが例外。「労働者」の範囲は労基法と同一と解されるので、労基法の知識がそのまま活きる。",
 rs02:"業務災害＝〈業務遂行性＋業務起因性〉。典型パターンを場面別に整理：作業中○／施設内休憩中は施設の欠陥なら○／出張中は原則○（積極的私的行為を除く）／事業場外の行事は強制参加なら○。認定権者は所轄労基署長。",
 rs03:"通勤の定義（7条）は選択式の超頻出。〈住居⇔就業の場所〉〈合理的な経路及び方法〉〈業務の性質を有するものを除く〉。移動類型3つ（往復・複数就業者の事業場間移動・単身赴任者の住居間移動）＋逸脱中断の原則と例外（日常生活上必要な行為×最小限度→復帰後は通勤）まで一気通貫で。",
 rs04:"療養（補償）等給付は〈現物給付（療養の給付）が原則・費用支給が例外〉〈一部負担金なし（通勤災害の療養給付のみ原則200円）〉〈範囲：診察・薬剤・処置手術・在宅・入院・移送〉〈治ゆ＝症状固定で終了〉。「治ゆ」の意味（完治ではなく症状固定）は全給付に関わる重要概念。",
 rs05:"休業（補償）等給付は〈待期通算3日〉〈4日目から60％＋特別支給金20％〉〈業務災害の待期3日は事業主が労基法の休業補償〉。健保の傷病手当金〈連続3日待期・3分の2〉との対比表を作ると、労災・健保の両科目で得点源になる。",
 rs06:"年金・一時金の境界線を数字で暗記：〈障害＝1〜7級年金／8〜14級一時金〉〈傷病補償年金＝1〜3級（療養開始後1年6か月）〉〈遺族補償一時金＝1,000日分〉。前払一時金（障害・遺族）の存在も問われる。等級表の中身よりまず枠組みを。",
 rs07:"遺族補償年金は〈生計維持〉が大前提、順位は〈配偶者→子→父母→孫→祖父母→兄弟姉妹〉で最先順位者のみ受給。妻だけ無条件、他は年齢（60歳以上／18歳年度末まで）or障害の要件。転給制度（失権すると次順位者へ）は労災独自で、厚年の遺族年金にはない点が横断論点。",
 rs08:"特別加入は〈第1種＝中小事業主等（事務組合委託が要件）〉〈第2種＝一人親方等〉〈第3種＝海外派遣者（申請必要）〉。給付基礎日額は申請に基づく選択制。フリーランス新法関連で第2種の対象拡大が続いており、改正の狙われどころ。",
 rs09:"二次健康診断等給付は労災法の中で異色の「予防」給付。〈一次健診で血圧・血中脂質・血糖・腹囲（BMI）の4項目すべてに異常所見〉〈年度1回〉〈二次健診＋特定保健指導〉〈既に脳・心臓疾患の症状がある者は対象外〉。安衛法の健康診断とセットで覚える。",
 rs10:"通則は〈退職しても受給権不変〉〈譲渡・担保・差押え禁止〉〈公課禁止〉〈労働者の故意→不支給、故意の犯罪行為・重大な過失→支給制限〉〈事業主の未手続→費用徴収（故意100％・重過失40％）〉。横断的に他の社会保険でもほぼ同じ構造なので、ここで型を作る。",
 ko01:"被保険者4種類〈一般／高年齢（65歳以上）／短期雇用特例／日雇〉と適用除外〈週20時間未満・31日以上の雇用見込みなし・昼間学生等〉が出発点。週10時間への適用拡大（令和10年10月施行予定）は改正論点として今後問われる可能性大。",
 ko02:"受給の入口：〈失業の定義（離職＋労働の意思・能力＋職業に就けない）〉〈原則：離職前2年に被保険者期間12か月／特定受給資格者等：1年に6か月〉〈本人がハローワークで求職の申込み→受給資格決定〉。「2年・12」「1年・6」は瞬時に出るように。",
 ko03:"被保険者期間は〈離職日から遡って1か月ごとに区切る（暦月ではない）〉〈賃金支払基礎日数11日以上または労働時間80時間以上で1か月〉。基礎日数11日は年休の比例付与等とは無関係の独立した数字なので混同しない。",
 ko04:"〈待期＝通算7日（全員）〉〈給付制限：正当な理由のない自己都合＝原則1か月（5年内3回以上は3か月・教育訓練受講なら制限なし）／重責解雇＝3か月〉。令和7年4月改正で1か月に短縮された点は最新論点として最頻出級。労災の待期3日・健保の連続3日と横断比較を。",
 ko05:"基本手当日額＝賃金日額×給付率〈50〜80％（60〜64歳は45〜80％）〉。賃金日額は〈最後の6か月の賃金総額÷180〉で、賞与等は除外。低賃金者ほど高率という再分配構造を理解すると選択肢が切りやすい。上限・下限額は毎年8月に改定される（数字は直前期に確認）。",
 ko06:"所定給付日数は3つの表で整理：〈一般＝90/120/150日（年齢区分なし）〉〈特定受給資格者＝90〜330日（年齢×期間）〉〈就職困難者＝150/300/360日〉。「一般には年齢区分がない」「最長360日は就職困難者」が択一の急所。",
 ko07:"65歳以上は〈高年齢被保険者→高年齢求職者給付金（一時金）：1年以上50日分・1年未満30日分〉。要件は離職前1年に6か月。年金との併給調整なし・何度でも受給可という特徴も問われる。",
 ko08:"育児休業給付金は〈休業開始前2年にみなし被保険者期間12か月〉〈180日まで67％・以後50％〉〈賃金との合計が80％超で減額〉〈原則子1歳まで（延長で最長2歳）〉。令和7年新設の出生後休業支援給付金（13％上乗せ）・育児時短就業給付金は最新改正として要マーク。",
 ko09:"教育訓練給付は3階建てで率を暗記：〈一般20％（上限10万）〉〈特定一般40％〉〈専門実践50％＋追加給付〉。支給要件期間は原則3年（初回1年）。雇用保険は「率と上限額」の暗記科目という性格が強い。",
 ko10:"再就職手当は〈残日数3分の1以上＝60％／3分の2以上＝70％〉。早期再就職ほど有利な設計。就業促進定着手当（6か月定着＋賃金低下）、就業手当・常用就職支度手当との区別も整理。「前の会社に戻ったら不支給」は定番ひっかけ。",
 ch01:"徴収法は「手続と数字の科目」。保険関係は〈適用事業＝事業開始日に当然成立〉〈暫定任意適用事業＝申請＋認可日に成立〉。任意加入の同意要件〈労災＝同意不要（過半数希望で加入義務）／雇用＝2分の1以上の同意（過半数希望で加入義務）〉の対比が頻出。",
 ch02:"届出・納付の期限を数字でセット暗記：〈成立届＝10日以内〉〈概算保険料＝50日以内〉〈増加概算＝30日以内〉。未手続事業主への費用徴収（労災法側）とリンクさせると記憶が強化される。",
 ch03:"労働保険料は〈自主申告・自主納付〉が大原則（申告しない場合に政府が認定決定）。概算保険料＝賃金総額の見込額×保険料率。見込額が前年度の50％以上200％以下なら前年度実績を使う、という実務的ルールも択一で問われる。",
 ch04:"年度更新は〈保険年度＝4/1〜3/31〉〈6月1日から40日以内（7月10日まで）に確定精算＋新年度概算を同時申告〉。不足は納付・超過は充当または還付。この一連の流れを図にして覚えると徴収法全体の骨格になる。",
 ch05:"延納の要件〈概算保険料40万円以上（一方のみ成立は20万円以上）または事務組合委託〉、分割は〈継続事業＝最大3期〉。各期の納期限（7/10・10/31・1/31、事務組合は2期以降14日延長）まで覚えると完璧。有期事業の延納要件（75万円以上等）との対比も後で。",
 ch06:"増加概算保険料は2要件〈見込額が2倍超に増加〉×〈差額13万円以上〉→〈30日以内〉に申告納付。「2倍・13万・30日」と呪文化する。労災保険率の引上げ等があった場合の差額徴収（追加徴収）との区別も意識。",
 ch07:"メリット制は〈労災保険率を±40％の範囲で増減〉〈継続事業の規模要件：100人以上、又は20人以上100人未満かつ災害度係数0.4以上〉〈収支率の算定から通勤災害・二次健診給付は除外〉。雇用保険にはメリット制がない点、特例メリット制（申告必要）の存在も押さえる。",
 ch08:"事務組合への委託可能規模〈金融・保険・不動産・小売＝50人以下／卸売・サービス＝100人以下／その他＝300人以下〉。委託できない事務〈印紙保険料の事務・保険給付の請求事務〉。報奨金制度・追徴金等の納付責任（組合が政府に対して責任を負う）も頻出。",
 ch09:"印紙保険料は日雇労働被保険者の特別ルール：〈一般保険料＋印紙保険料の二本立て〉〈労使折半〉〈第1〜3級の定額〉〈印紙貼付・消印または納付計器〉〈追徴金は25％（一般の10％と対比）〉。雇用保険法の日雇給付（印紙の納付状況で日額が決まる）とつながる。",
 ch10:"罰則的金銭の整理：〈追徴金＝認定決定ペナルティ：確定保険料10％・印紙保険料25％（概算には課されない）〉〈延滞金＝督促後も納めない場合に納期限の翌日から計算〉〈天災等やむを得ない理由なら免除〉。社会保険各法の延滞金と横断比較すると一般常識対策にもなる。",
 kh01:"適用事業所は〈法人＝1人でも強制／個人＝法定業種×常時5人以上で強制／それ以外＝任意適用（2分の1以上の同意＋認可）〉。この枠組みは厚生年金とほぼ共通なので、健保で固めれば厚年でも使える。",
 kh02:"短時間労働者の適用拡大は改正が続く最重要テーマ。現行要件〈週20時間・月8.8万円・2か月超見込み・学生除外・特定適用事業所〉を正確に。企業規模要件の段階的撤廃、賃金要件の見直しなど、受験年度の最新状態を直前期に必ず確認すること。",
 kh03:"被扶養者は〈3親等内の親族〉＋〈生計維持〉＋〈国内居住（原則）〉。同一世帯が不要なのは〈直系尊属・配偶者（事実婚含む）・子・孫・兄弟姉妹〉だけで、それ以外（配偶者の父母、おじおば等）は同一世帯必須。収入基準〈130万／180万＋収入の2分の1未満〉は税の103万・106万と混同しない。",
 kh04:"標準報酬月額は〈資格取得時決定／定時決定（4・5・6月→9月〜翌8月）／随時改定（固定的賃金変動＋2等級差＋3か月17日以上）／育休等終了時改定・産休終了時改定〉の5つの決定・改定の場面を整理するのが本丸。等級は健保50級・厚年32級の対比。",
 kh05:"傷病手当金は〈連続3日待期→4日目から〉〈12か月平均の標準報酬月額÷30×2/3〉〈通算1年6か月（令和4年改正）〉。労災の休業給付・雇用の基本手当との横断比較表（待期・額・期間）は選択式でも択一でも武器になる。",
 kh06:"出産関係は〈出産手当金：産前42日（多胎98日）＋産後56日・3分の2〉〈出産育児一時金：定額（額は改定されるので直前期に確認）〉〈出産＝妊娠4か月（85日）以後〉。労基法の産前産後休業と期間の対応関係を意識すると暗記が半分で済む。",
 kh07:"一部負担金の階段〈就学前2割／就学後〜69歳3割／70〜74歳2割（現役並み3割）〉。75歳以上は後期高齢者医療制度（社一の領域）へ。高額療養費の自己負担限度額の仕組み（所得区分・多数回該当・世帯合算）が次のステップ。",
 kh08:"任意継続被保険者は数字3点〈継続2か月以上の被保険者期間／喪失日から20日以内に申出／最長2年〉＋〈保険料全額自己負担（上限あり）〉＋〈申出による任意脱退可（令和4年改正）〉。資格喪失後の給付（傷病手当金の継続給付等）とセットで問われる。",
 kh09:"保険者2つ〈協会けんぽ（組合員以外を管掌・都道府県単位の保険料率）／健康保険組合（単一700人・共同3,000人以上、2分の1以上の同意＋認可で設立）〉。日雇特例被保険者の保険者は協会、という細部も択一で出る。",
 kh10:"保険料は〈労使折半・納付義務は事業主〉〈賞与も標準賞与額（年度累計573万円上限）で徴収〉〈産休・育休中は労使とも免除〉。育休免除の要件（月内14日以上等の令和4年改正）は新しい論点として注意。",
 kn01:"被保険者3類型を表で：〈1号＝国内居住・20〜60歳・残余／2号＝厚年被保険者（年齢下限なし・65歳以上は受給権者を除く）／3号＝2号の被扶養配偶者・20〜60歳・国内居住〉。国内居住要件の有無（1号○・2号×・3号○）が頻出ポイント。",
 kn02:"免除は〈法定免除（障害年金1・2級／生活扶助／施設入所）〉〈申請免除4段階（全額・3/4・半額・1/4）〉〈学生納付特例〉〈納付猶予（50歳未満）〉。「資格期間に入るか／年金額に反映されるか」の2軸で表を作る：免除＝両方○（一部反映）、特例・猶予＝資格期間のみ○。追納は10年以内。",
 kn03:"老齢基礎年金は〈資格期間10年（納付済＋免除＋合算対象期間）〉〈65歳から〉。合算対象期間（カラ期間）＝「資格期間には入るが額には入らない」の代表例（昔の任意加入未加入期間等）を押さえる。25年→10年の短縮（平成29年8月）は沿革として問われる。",
 kn04:"年金額は〈満額×（納付済月数＋免除月数×反映率）÷480〉。反映率（平成21年4月以後）〈全額免除1/2・3/4免除5/8・半額6/8・1/4免除7/8〉は分数のまま暗記（国庫負担1/2が下駄）。平成21年3月以前は国庫負担1/3ベースで分数が変わる点は上級論点。",
 kn05:"障害基礎年金は4点セット〈初診日に被保険者等／障害認定日＝初診日から1年6か月／納付要件＝3分の2または直近1年特例／1級＝2級×1.25〉＋〈子の加算〉＋〈20歳前傷病（納付要件なし・所得制限あり）〉。「初診日」を軸にすべてが決まる構造を理解する。",
 kn06:"遺族基礎年金＝「子のある配偶者」か「子」だけ。〈子＝18歳年度末（障害1・2級は20歳未満）・未婚〉。労災（兄弟姉妹まで・転給あり）、遺族厚生（兄弟姉妹除く・転給なし）との対象範囲の対比表は横断整理の定番中の定番。",
 kn07:"付加年金は第1号の独自上乗せ：〈納める400円・もらう200円×月数〉〈1号・任意加入者のみ〉〈国民年金基金と併用不可〉〈繰上げ繰下げに連動〉。少額だが択一で1肢は出る「コスパの良い」論点。",
 kn08:"第1号独自給付3つ〈付加年金・寡婦年金・死亡一時金〉。寡婦年金〈夫の納付済＋免除10年以上・婚姻10年以上・60〜65歳・夫の老基×3/4〉、死亡一時金〈36月以上・12〜32万円〉、両方該当なら選択。脱退一時金（外国人）も同じ並びで整理。",
 kn09:"保険料の手続系数字〈納期限＝翌月末日〉〈徴収権の時効＝2年〉〈前納＝6か月〜2年等・割引あり〉〈追納＝10年以内（免除等の期間）〉。「2年（時効・後払い限界）と10年（追納）」の区別が急所。3号は個別納付なし。",
 kn10:"支給期間〈翌月起算・消滅月まで〉、支払期月〈偶数月6回・前2か月分後払い〉、端数処理、未支給年金（3親等内の親族まで・自己の名で請求）。この通則は国年・厚年共通なので一度固めれば両科目で得点できる。",
 kk01:"厚年の被保険者は〈適用事業所＋70歳未満〉。〈健保75歳（後期高齢者医療へ）／厚年70歳〉の年齢差は超頻出。適用事業所の枠組み（法人1人・個人5人法定業種）は健保と共通。高齢任意加入（70歳以上・受給資格を満たすまで）は例外として押さえる。",
 kk02:"標準報酬の健保・厚年対比〈月額等級：健保50級／厚年32級〉〈賞与上限：健保＝年度累計573万円／厚年＝1回150万円〉。決定・改定の仕組み（定時決定・随時改定）は共通。等級の上限は改正で動くので、数字は直前期に最終確認。",
 kk03:"老齢厚生年金の要件〈資格期間10年＋厚年1か月以上＋65歳〉vs 特別支給（60歳台前半）〈＋厚年1年以上＋生年月日〉。「1か月か1年か」の区別が定番。65歳からは〈老齢基礎（1階）＋報酬比例の老齢厚生（2階）＋加給〉の構造図を頭に入れる。",
 kk04:"在職老齢年金は式で覚える〈停止額＝（総報酬月額相当額＋基本月額－支給停止調整額）×1/2〉。〈基礎年金は止まらない〉〈70歳以上の在職者にも適用（保険料負担なし）〉〈調整額は毎年度改定→数字は直前確認〉。在職定時改定（65歳以上・毎年9月改定）も新しめの論点。",
 kk05:"加給年金は〈本人20年以上〉＋〈65歳未満の配偶者／18歳年度末の子〉＋〈生計維持〉。配偶者が65歳になると終了→配偶者の老齢基礎年金に振替加算（昭和41年4月1日以前生まれ）。配偶者自身が20年以上の老厚等を受けられる間は停止、という調整も頻出。",
 kk06:"障害給付の構造対比〈基礎＝1・2級／厚年＝1・2・3級＋障害手当金〉〈1級＝1.25倍（共通）〉〈厚年1・2級＝配偶者加給／基礎＝子の加算〉〈3級・手当金には最低保障〉。基礎と厚年を常にペアで覚えるのが年金2法攻略の基本姿勢。",
 kk07:"遺族厚生年金は〈範囲：配偶者・子・父母・孫・祖父母（兄弟姉妹×）〉〈夫・父母・祖父母＝55歳以上（支給60歳〜）〉〈額＝報酬比例×3/4〉〈短期要件＝300月みなし〉〈30歳未満の子のない妻＝5年有期〉。男女差の見直し改正が進行中なので、受験年度の施行状況を直前に確認。",
 kk08:"年金分割2種類〈合意分割（平成19年4月〜・按分上限1/2・合意or裁判）／3号分割（平成20年4月以後の3号期間・請求のみで1/2）〉〈請求期限＝原則2年〉〈分割対象＝標準報酬の記録〉。「いつ以後の期間か」「合意が要るか」の2軸で区別。",
 kk09:"保険料は〈18.3％で固定（保険料水準固定方式・平成29年9月〜）〉〈労使折半・納付義務は事業主〉〈産休・育休中は労使とも免除＋納付済扱い〉。「免除なのに年金額が減らない」のが国年の免除との大きな違いで、ひっかけに使われる。",
 kk10:"繰上げ・繰下げの数字〈繰上げ：60歳〜・1月0.4％減・基礎と同時〉〈繰下げ：66歳〜75歳・1月0.7％増・基礎と厚生は別々に可〉。最大〈繰上げ24％減／繰下げ84％増〉。在職老齢年金で停止される部分は繰下げ増額の対象にならない、という応用論点まで行ければ上級。",
 la01:"労働契約法は〈民事ルール・罰則なし・監督なし〉という性格をまず押さえる（労基法との対比）。3条の5原則〈対等合意・均衡考慮・仕事と生活の調和・信義誠実・権利濫用禁止〉＋5条の安全配慮義務は条文の語句レベルで暗記。公務員に不適用、も定番。",
 la02:"無期転換は〈同一の使用者・通算5年超・申込み→承諾みなし〉＋〈クーリング原則6か月〉＋〈転換後の条件は別段の定めなければ従前どおり〉。有期特措法による特例（高度専門職・定年後継続雇用者）の存在も一言知っておくと差がつく。",
 la03:"判例法理の条文化トリオ〈14条出向・15条懲戒・16条解雇〉はいずれも「客観的に合理的な理由＋社会通念上の相当性」型。就業規則の不利益変更は〈9条＝合意原則／10条＝周知＋合理性で例外〉の構造。合理性の考慮要素5つは選択式対策として音読推奨。",
 la04:"労組法は〈労働協約：書面＋署名or記名押印・上限3年・規範的効力〉〈不当労働行為3類型：不利益取扱い・団交拒否・支配介入（経費援助含む）〉〈救済は労働委員会〉〈刑事免責・民事免責〉が骨格。労調法（あっせん・調停・仲裁）とセットで出る。",
 la05:"最賃法は〈地域別＝都道府県ごと・必ず適用・罰則あり〉〈特定（産業別）＝罰則は労基法24条で担保〉〈3要素＋生活保護との整合性〉〈下回る契約はその部分無効→最賃額〉〈派遣は派遣先基準〉〈減額特例＝許可制〉。毎年の改定額そのものより仕組みが問われる。",
 la06:"派遣法は〈期間制限2本立て：事業所単位3年（延長可）・個人単位3年（延長不可）〉〈無期雇用派遣・60歳以上は制限対象外〉〈日雇派遣原則禁止〉〈労働契約申込みみなし制度〉〈同一労働同一賃金：派遣先均等均衡方式or労使協定方式〉が頻出ゾーン。",
 la07:"育介法は数字の科目：〈育休＝原則1歳（最長2歳）・2回分割〉〈産後パパ育休＝出生後8週内に4週・2回分割〉〈介護休業＝93日・3回〉〈子の看護等休暇・介護休暇＝年5日（2人以上10日）・時間単位〉。令和7年施行の改正（看護休暇の対象拡大、3歳〜小学校就学前の柔軟な働き方等）は最新論点。",
 la08:"高年法は〈60歳未満定年禁止〉→〈65歳まで雇用確保措置＝義務（3択）〉→〈70歳まで就業確保措置＝努力義務（5択・創業支援等措置含む）〉の3段ロケット。「義務か努力義務か」「雇用か就業か」の言葉の違いに敏感になること。",
 la09:"障害者雇用は〈雇用率制度（対象：身体・知的・精神）〉〈納付金（100人超・不足1人月5万円）／調整金・報奨金〉〈週10〜20時間の特定短時間労働者0.5カウント〉が柱。法定雇用率は段階的引上げ中なので、受験年度の適用率を直前に必ず確認。",
 la10:"パワハラ防止（労働施策総合推進法）は〈定義3要素〉〈全企業の措置義務〉〈不利益取扱い禁止〉。セクハラ（均等法）・マタハラ（均等法・育介法）の防止措置とまとめて「ハラスメント横断」で整理すると効率的。各ハラスメントの根拠法を答えられるように。",
 sa01:"国保は〈保険者：都道府県＋市町村（平成30年改革で都道府県が財政運営の責任主体）／国保組合〉〈被扶養者なし・全員被保険者〉〈被用者保険加入者は適用除外〉。市町村国保の保険料（税）方式、資格確認書等の実務系論点も近年の改正で動きがある。",
 sa02:"後期高齢者医療は〈75歳以上＋65〜74歳の障害認定者〉〈運営＝広域連合〉〈保険料は特別徴収原則〉〈現役世代からの後期高齢者支援金＋公費5割＋保険料1割強〉という財政構造まで見ておく。一部負担金（1割・一定以上所得2割・現役並み3割）も頻出。",
 sa03:"介護保険の被保険者は〈1号＝65歳以上・住所のみ／2号＝40〜65歳未満＋医療保険加入者〉。保険料の徴収方法〈1号＝市町村が徴収（年金からの特別徴収原則）／2号＝医療保険者が医療保険料と一体で徴収〉の対比も重要。",
 sa04:"給付は〈要介護→介護給付／要支援→予防給付〉〈認定＝市町村（認定審査会）〉〈2号は特定疾病16のみ〉〈利用者負担1割（2割・3割）〉〈区分支給限度基準額〉。ケアマネジメント・地域支援事業まで広げると社一の得点源になる。",
 sa05:"企業年金・個人年金は〈DC＝掛金確定・給付変動・自己運用／DB＝給付確定〉の対比が出発点。iDeCoの加入可能者・拠出限度額・受給開始（60〜75歳）は改正が続くので骨格優先で。DC・DB・iDeCo・国民年金基金の「誰が入れるか」マトリクスを作ると整理が速い。",
 sa06:"国民年金基金は〈1号＋任意加入者の2階〉〈任意加入・任意脱退不可〉〈付加保険料と併用不可〉〈全国国民年金基金へ統合（令和元年）〉。iDeCoとの限度額の枠の共有（合算管理）も実務的論点。",
 sa07:"社労士法は本試験で毎年ほぼ確実に出る。〈1号（作成・提出代行・事務代理）・2号（帳簿書類作成）＝独占／3号（相談指導）＝非独占〉〈帳簿2年保存〉〈事務所は1か所〉〈不正行為への懲戒（失格処分等3種）〉。受験生自身の職業法なので確実に得点したい。",
 sa08:"登録は連合会、入会は都道府県社労士会。特定社労士は〈紛争解決手続代理業務試験合格＋付記〉で〈あっせん代理（単独で和解締結まで・民間ADRは紛争目的価額120万円超は弁護士共同）〉。補佐人制度（訴訟で弁護士とともに出頭・陳述）は特定でなくても可、という区別が頻出。",
 sa09:"児童手当は令和6年10月の大改正〈高校生年代まで拡大・所得制限撤廃・第3子以降3万円（多子カウント見直し）・年6回払い〉が最大の出題ポイント。費用負担（国・地方・事業主拠出金）の構造も従来から頻出。子ども・子育て支援法との関係も一言。",
 sa10:"社一の沿革は年号の暗記：〈大正11年＝健康保険法（最古）〉〈昭和36年＝国民皆保険・皆年金〉〈昭和48年＝福祉元年〉〈昭和60年＝基礎年金導入（61年施行）〉〈平成12年＝介護保険施行〉〈平成20年＝後期高齢者医療〉。選択式で年号や法律名の組合せがそのまま出る。",
 k701:"本試験の洗礼・個数問題。1肢でも判定を誤ると失点するため正答率が低い形式。本問の核はエ＝「労基法の労働者に失業者は含まれない（含むのは労組法）」。基礎編で学んだ9条の定義が本試験ではこう問われる、という良いサンプル。個数問題は深追いせず、確実に判定できる肢から数えて消去するのが実戦テクニック。",
 k702:"平均賃金の最低保障（日給・時間給制：賃金総額÷労働日数×60％と原則計算の高い方）は計算込みで出る。本問Aの「6,000円」を自力で再現できるようになれば合格レベル。Dの「賃金締切日があれば直前締切日から起算」は細かい通達だが、消去法でも到達できる。",
 k703:"労働契約の論点は通達・判例の細部が問われる。「60歳以上は締結時の年齢で判断」「明示と相違→即時解除＋履行請求も可」「解雇制限は業務上傷病が生じた使用者のみ」。基礎編の知識＋『とどまり』『かかわらず』のような限定ワードへの注意で正解できる構成。",
 k704:"賃金5原則の応用回。正解Eの「休業期間中の休日には休業手当不要」は理屈（休日には労働義務がない→休業ではない）で導ける。Cの調整的相殺（過払いの翌月精算は全額払い違反でない）は判例知識として今後も出る。",
 k705:"36協定の当事者論点。「事業場単位で過半数判定」が本問の核で、基礎編で学んだ『労基法は事業場単位の法律』という大原則がそのまま正解に直結する。トーコロ事件（親睦団体代表の協定は無効）は判例の定番。",
 k706:"割増賃金の基礎から除外できる賃金は〈家族手当・通勤手当・別居手当・子女教育手当・住宅手当・臨時に支払われた賃金・1か月を超える期間ごとに支払われる賃金〉の限定列挙7つ。ただし名称でなく実質で判断（一律支給の『通勤手当』は除外できない）。この『実質判断』が本問の全肢を貫くテーマ。",
 k707:"就業規則の手続＋判例のミックス。正解Dの「押印不要」は押印廃止という近年の改正を反映した出題で、改正情報の重要性がわかる1問。西日本鉄道事件（所持品検査）とシフト制通達は今後も再出題が見込まれる。",
 k708:"安衛の管理体制は規則レベルの細部まで出る。〈衛生管理者＝毎週1回巡視／産業医＝毎月1回（情報提供があれば2か月に1回）巡視〉の対比は何度も出題されている鉄板。Cの電子申請原則化（令和7年1月）のような直近改正も混ぜてくるのが本試験。",

 k801:"適用の事例判断は「誰の指揮監督下で働いているか」と「労働者か否か」の2軸。〈出向＝指揮監督を受ける側の保険関係〉〈派遣＝派遣元〉〈A型＝労働者・B型＝原則労働者でない〉〈公務員＝公務災害補償の世界〉。出向と派遣で結論が違う点が最大の対比。",
 k802:"業務災害の事例問題は「事業主の支配下か・業務に伴う危険の現実化か」で1肢ずつ判定する。〈呼出し出勤の途上＝業務〉〈自発的な私的行為＝業務外〉〈出張過程＝広く業務〉〈自然災害でも作業環境の危険が現実化すれば業務上〉〈代替経路の帰宅＝通勤（業務ではない）〉。テキスト第3巻2章の感覚がそのまま使える。",

};

/* ───────── 科目・セット定義 ───────── */
const CATS = [
 {key:"rk", name:"労働基準法", set:"基礎編", short:"労基・基礎"},
 {key:"rb", name:"労働基準法", set:"応用編", short:"労基・応用"},
 {key:"ae", name:"労働安全衛生法", set:"基礎編", short:"安衛・基礎"},
 {key:"rs", name:"労災保険法", set:"基礎編", short:"労災・基礎"},
 {key:"ko", name:"雇用保険法", set:"基礎編", short:"雇用・基礎"},
 {key:"ch", name:"労働保険徴収法", set:"基礎編", short:"徴収・基礎"},
 {key:"kh", name:"健康保険法", set:"基礎編", short:"健保・基礎"},
 {key:"kn", name:"国民年金法", set:"基礎編", short:"国年・基礎"},
 {key:"kk", name:"厚生年金保険法", set:"基礎編", short:"厚年・基礎"},
 {key:"la", name:"労働一般常識", set:"基礎編", short:"労一・基礎"},
 {key:"sa", name:"社会保険一般常識", set:"基礎編", short:"社一・基礎"},
 {key:"k7", name:"第57回 本試験", set:"労基・安衛", short:"57回本試験"},
 {key:"k8", name:"第57回 本試験", set:"労災・徴収", short:"57回労災徴収"}
];
function qLabel(q){
  const cat = CATS.find(c=>q.id.startsWith(c.key));
  const list = QUESTIONS.filter(x=>x.id.startsWith(cat.key));
  return {cat, num:list.findIndex(x=>x.id===q.id)+1, total:list.length};
}
const STORE_KEY = "sharoushi-roukihou-v1";
let progress = {};            // {qid:{c:正解数, w:不正解数, last:"o"|"x"}}
let session = null;           // {order:[idx], pos, results:[{idx,ok}]}

/* ハイブリッド保存：Claude内ではClaude保存、通常ブラウザではlocalStorage保存 */
const hasClaudeStorage = (typeof window.storage !== "undefined") && window.storage && (typeof window.storage.get === "function");

async function loadProgress(){
  if(hasClaudeStorage){
    try{
      const r = await window.storage.get(STORE_KEY);
      if(r && r.value) progress = JSON.parse(r.value);
    }catch(e){ progress = {}; }
  }else{
    try{
      const v = localStorage.getItem(STORE_KEY);
      if(v) progress = JSON.parse(v);
    }catch(e){ progress = {}; }
  }
}
async function saveProgress(){
  if(hasClaudeStorage){
    try{ await window.storage.set(STORE_KEY, JSON.stringify(progress)); }
    catch(e){ console.error("保存に失敗しました", e); }
  }else{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }
    catch(e){ console.error("保存に失敗しました（プライベートブラウズ中は保存できないことがあります）", e); }
  }
}
async function deleteProgress(){
  if(hasClaudeStorage){
    try{ await window.storage.delete(STORE_KEY); }catch(e){}
  }else{
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  }
}

/* ───────── 画面制御 ───────── */
const $ = id => document.getElementById(id);
function show(name){
  ["loading","home","quiz","result"].forEach(s=>{
    $("screen-"+s).classList.toggle("hidden", s!==name);
  });
  $("next-bar").classList.add("hidden");
  $("result-bar").classList.toggle("hidden", name!=="result");
  window.scrollTo(0,0);
}

function wrongIndices(){
  return QUESTIONS.map((q,i)=>i).filter(i=>{
    const p = progress[QUESTIONS[i].id];
    return p && p.last === "x";
  });
}

function renderHome(){
  const answered = QUESTIONS.filter(q=>progress[q.id]).length;
  const lastResults = QUESTIONS.map(q=>progress[q.id]).filter(Boolean);
  const lastCorrect = lastResults.filter(p=>p.last==="o").length;
  const rate = lastResults.length ? Math.round(lastCorrect/lastResults.length*100) : null;
  const wrongs = wrongIndices().length;
  $("st-answered").innerHTML = answered + '<span class="unit">問</span>';
  $("st-rate").innerHTML = (rate===null?"–":rate) + '<span class="unit">%</span>';
  $("st-wrong").innerHTML = wrongs + '<span class="unit">問</span>';
  $("btn-review").classList.toggle("disabled", wrongs===0);
  // 科目・セットメニュー
  const menu = $("cat-menu");
  menu.innerHTML = "";
  CATS.forEach(cat=>{
    const list = QUESTIONS.filter(q=>q.id.startsWith(cat.key));
    const done = list.filter(q=>progress[q.id]).length;
    const ok = list.filter(q=>progress[q.id] && progress[q.id].last==="o").length;
    const btn = document.createElement("button");
    btn.className = "menu-btn";
    btn.innerHTML = cat.name+"　"+cat.set+
      '<span class="desc">全'+list.length+'問　解答済み '+done+'問・直近○ '+ok+'問</span>';
    btn.addEventListener("click", ()=>startSession(list.map(q=>QUESTIONS.indexOf(q))));
    menu.appendChild(btn);
  });
  show("home");
}

/* ───────── 出題 ───────── */
function startSession(order){
  session = {order, pos:0, results:[]};
  renderQuestion();
  show("quiz");
}
function renderQuestion(){
  const idx = session.order[session.pos];
  const q = QUESTIONS[idx];
  const lab = qLabel(q);
  // 肢の並びをシャッフル（過去問はnoShuffleで原文の並びを維持）
  const perm = [0,1,2,3,4];
  if(!q.noShuffle){
    for(let i=perm.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [perm[i],perm[j]]=[perm[j],perm[i]];
    }
  }
  session.perm = perm;
  $("q-no").textContent = "問 " + lab.num + "　" + q.title;
  $("q-prog").textContent = lab.cat.short + "　" + (session.pos+1) + " / " + session.order.length;
  $("q-text").textContent = q.q;
  $("feedback").classList.add("hidden");
  const ul = $("choices");
  ul.innerHTML = "";
  const alphas = ["Ａ","Ｂ","Ｃ","Ｄ","Ｅ"];
  perm.forEach((orig,i)=>{
    const li = document.createElement("li");
    li.className = "choice";
    li.innerHTML = '<span class="alpha">'+alphas[i]+'</span><span>'+q.choices[orig]+'</span>';
    li.addEventListener("click", ()=>pick(i));
    ul.appendChild(li);
  });
  $("next-bar").classList.add("hidden");
}

function markSVG(ok){
  // 朱の採点マーク：○ または ×（手書きふうに一筆で描画）
  const o = '<svg viewBox="0 0 48 48"><circle class="stroke" cx="24" cy="24" r="18" transform="rotate(-90 24 24)"/></svg>';
  const x = '<svg viewBox="0 0 48 48"><path class="stroke" d="M10 10 L38 38 M38 10 L10 38"/></svg>';
  return '<span class="mark">'+(ok?o:x)+'</span>';
}

async function pick(i){
  const idx = session.order[session.pos];
  const q = QUESTIONS[idx];
  const perm = session.perm;
  const ok = (perm[i] === q.answer);
  const correctPos = perm.indexOf(q.answer);
  const lis = [...$("choices").children];
  lis.forEach((li,j)=>{
    li.classList.add("locked","dim");
    li.replaceWith(li.cloneNode(true)); // remove listeners
  });
  const fresh = [...$("choices").children];
  fresh[i].classList.add("picked");
  fresh[i].classList.remove("dim");
  fresh[correctPos].classList.remove("dim");
  fresh[i].insertAdjacentHTML("afterbegin", markSVG(ok));
  if(!ok){
    fresh[correctPos].insertAdjacentHTML("afterbegin",
      '<span class="mark" style="animation-delay:.2s">'+ '<svg viewBox="0 0 48 48"><circle class="stroke" cx="24" cy="24" r="18" transform="rotate(-90 24 24)"/></svg>'+'</span>');
  }
  // 解説（表示中の並び順に合わせる）
  $("verdict").textContent = ok ? "正　解" : "不正解";
  $("q-point").textContent = POINTS[q.id] || "";
  const alphas = ["Ａ","Ｂ","Ｃ","Ｄ","Ｅ"];
  $("kai-list").innerHTML = perm.map((orig,j)=>
    '<p class="kai-item"><b>'+alphas[j]+'</b>　<span class="ox">'+(orig===q.answer?"○":"×")+'</span>'+q.kai[orig]+'</p>'
  ).join("");
  $("feedback").classList.remove("hidden");
  // 進捗保存
  session.results.push({idx, ok});
  const p = progress[q.id] || {c:0,w:0,last:null};
  if(ok){p.c++;}else{p.w++;}
  p.last = ok ? "o":"x";
  progress[q.id] = p;
  await saveProgress();
  // ボタン
  $("btn-next").textContent = (session.pos === session.order.length-1) ? "採点結果を見る" : "次の問題へ";
  $("next-bar").classList.remove("hidden");
}

function nextQuestion(){
  if(session.pos === session.order.length-1){
    renderResult();
  }else{
    session.pos++;
    renderQuestion();
  }
}

/* ───────── 結果 ───────── */
function renderResult(){
  const total = session.results.length;
  const correct = session.results.filter(r=>r.ok).length;
  $("r-correct").textContent = correct;
  $("r-total").textContent = total;
  const rate = total? correct/total : 0;
  $("r-cap").textContent = rate===1 ? "全問正解！この調子" :
                  rate>=0.7 ? "合格ライン水準。間違いを潰そう" :
                  "まだ伸びしろ十分。解説を読み返そう";
  $("r-list").innerHTML = session.results.map(r=>{
    const q = QUESTIONS[r.idx];
    const lab = qLabel(q);
    return '<div class="result-row"><span class="ox">'+(r.ok?"○":"×")+'</span><span class="ttl">'+lab.cat.short+'　問'+lab.num+'　'+q.title+'</span></div>';
  }).join("");
  const hasWrong = session.results.some(r=>!r.ok);
  $("btn-retry-wrong").style.display = hasWrong ? "" : "none";
  show("result");
}

/* ───────── イベント ───────── */
$("btn-review").addEventListener("click", ()=>{
  const w = wrongIndices();
  if(w.length) startSession(w);
});
$("btn-random").addEventListener("click", ()=>{
  const idxs = QUESTIONS.map((_,i)=>i);
  for(let i=idxs.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i],idxs[j]]=[idxs[j],idxs[i]];
  }
  startSession(idxs.slice(0,10));
});
$("btn-reset").addEventListener("click", async ()=>{
  if(confirm("成績データをリセットします。よろしいですか？")){
    progress = {};
    await deleteProgress();
    renderHome();
  }
});
$("btn-next").addEventListener("click", nextQuestion);
$("btn-quit").addEventListener("click", renderHome);
$("btn-home2").addEventListener("click", renderHome);
$("btn-retry-wrong").addEventListener("click", ()=>{
  const w = session.results.filter(r=>!r.ok).map(r=>r.idx);
  if(w.length) startSession(w);
  else renderHome();
});

/* ───────── 起動 ───────── */
(async function init(){
  await loadProgress();
  renderHome();
})();
</script>
