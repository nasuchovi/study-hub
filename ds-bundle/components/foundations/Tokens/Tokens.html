<!-- @dsCard group="Foundations" name="トークン / Tokens" subtitle="確定7色＋支持色、しっぽり明朝。変更不可の土台" width="440" height="420" -->
<style>
  :root{--soot:#14100c;--paper:#221b13;--paper2:#2b231a;--ink:#d9cfba;--dim:#8a7f6c;--bone:#ece2cb;--blood:#a63d2e;--gold:#bd9448;--line:#3a3126;--sil:#0c0906;--candle:#e0aa60}
  html,body{margin:0;height:100%}
  .card{min-height:100%;background:var(--soot);color:var(--ink);font-family:"Shippori Mincho",serif;padding:18px 20px;box-sizing:border-box}
  h1{font-size:15px;color:var(--bone);font-weight:700;letter-spacing:.1em;margin:0 0 12px}
  .sw{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:2px;padding:6px 8px;font-size:11.5px}
  .dot{width:22px;height:22px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(255,255,255,.06)}
  .nm{color:var(--bone)}.hex{color:var(--dim);font-size:10.5px;margin-left:auto;letter-spacing:.04em}
  .type{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .big{font-size:26px;color:var(--bone);font-weight:700;letter-spacing:.2em}
  .num{font-size:22px;color:var(--bone)}
  .body{font-size:14px;color:var(--ink);line-height:1.85;margin-top:4px}
  .note{font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:.05em}
</style>
<div class="card">
  <h1>確定デザイントークン（変更不可の土台）</h1>
  <div class="sw">
    <div class="chip"><span class="dot" style="background:#14100c"></span><span class="nm">煤 soot</span><span class="hex">#14100c</span></div>
    <div class="chip"><span class="dot" style="background:#221b13"></span><span class="nm">古紙 paper</span><span class="hex">#221b13</span></div>
    <div class="chip"><span class="dot" style="background:#d9cfba"></span><span class="nm">生成り ink</span><span class="hex">#d9cfba</span></div>
    <div class="chip"><span class="dot" style="background:#ece2cb"></span><span class="nm">骨 bone</span><span class="hex">#ece2cb</span></div>
    <div class="chip"><span class="dot" style="background:#a63d2e"></span><span class="nm">乾血 blood</span><span class="hex">#a63d2e</span></div>
    <div class="chip"><span class="dot" style="background:#bd9448"></span><span class="nm">燻金 gold</span><span class="hex">#bd9448</span></div>
    <div class="chip"><span class="dot" style="background:#e0aa60"></span><span class="nm">燭光 candle</span><span class="hex">#e0aa60</span></div>
    <div class="chip"><span class="dot" style="background:#8a7f6c"></span><span class="nm">褪せ dim</span><span class="hex">#8a7f6c</span></div>
    <div class="chip"><span class="dot" style="background:#3a3126"></span><span class="nm">罫 line</span><span class="hex">#3a3126</span></div>
    <div class="chip"><span class="dot" style="background:#0c0906"></span><span class="nm">影 sil</span><span class="hex">#0c0906</span></div>
  </div>
  <div class="type">
    <div class="big">無法の国に生まれて</div>
    <div class="num">2D6 ＝ 目標 6 ／ +2</div>
    <div class="body">しっぽり明朝。畳の上で死ねた者は、まだいない。</div>
    <div class="note">和文 Shippori Mincho（400/500/700）。数字は本文より1〜2段大きく骨色。縦書きはタイトルと墓碑のみ。</div>
  </div>
</div>
