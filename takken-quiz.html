<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>宅建 択一トレーニング｜宅建業法</title>
<style>
  :root{
    --paper:#FCFBF7; --ink:#23272F; --sub:#6B6F78; --line:#DCD8CD;
    --shu:#1B5E7A;        /* 宅建版は藍色の採点 */
    --marker:#9FD8E8; --marker-soft:#DCF0F5;
    --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","BIZ UDMincho",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","BIZ UDGothic",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 96px;}
  header{border-bottom:2px solid var(--ink);padding:20px 0 12px;margin-bottom:4px;}
  .exam-label{font-family:var(--sans);font-size:11px;letter-spacing:.22em;color:var(--sub);}
  h1{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.06em;margin-top:2px;}
  .subject-tag{display:inline-block;font-size:12px;border:1px solid var(--ink);padding:1px 10px;margin-top:8px;letter-spacing:.15em;}
  .stats{display:flex;border:1px solid var(--line);background:#fff;margin:20px 0 16px;}
  .stat{flex:1;text-align:center;padding:14px 4px 12px;}
  .stat + .stat{border-left:1px solid var(--line);}
  .stat .num{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.2;}
  .stat .num .unit{font-size:13px;font-weight:400;margin-left:1px;}
  .stat .lbl{font-size:11px;color:var(--sub);letter-spacing:.1em;}
  .menu-btn{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--ink);padding:16px 18px;margin-bottom:12px;font-family:var(--sans);font-size:16px;color:var(--ink);cursor:pointer;position:relative;}
  .menu-btn:active{background:var(--marker-soft);}
  .menu-btn .desc{display:block;font-size:12px;color:var(--sub);margin-top:2px;}
  .menu-btn:after{content:"→";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--sub);}
  .menu-btn.disabled{opacity:.4;pointer-events:none;}
  .reset-link{display:block;margin:22px auto 0;background:none;border:none;font-size:12px;color:var(--sub);text-decoration:underline;cursor:pointer;}
  .note{font-size:12px;color:var(--sub);border-top:1px dashed var(--line);margin-top:26px;padding-top:12px;}
  .q-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 6px;}
  .q-no{font-family:var(--serif);font-weight:700;font-size:20px;}
  .q-prog{font-size:12px;color:var(--sub);letter-spacing:.08em;}
  .q-text{font-family:var(--serif);font-size:16.5px;line-height:2;margin-bottom:18px;text-align:justify;white-space:pre-line;}
  .choices{list-style:none;}
  .choice{display:flex;gap:12px;border:1px solid var(--line);background:#fff;padding:13px 14px;margin-bottom:10px;cursor:pointer;position:relative;font-family:var(--serif);font-size:15px;line-height:1.85;text-align:justify;}
  .choice:active{background:var(--marker-soft);}
  .choice .alpha{font-family:var(--serif);font-weight:700;flex-shrink:0;}
  .choice.locked{cursor:default;}
  .choice.picked{background:var(--marker);border-color:var(--ink);}
  .choice.dim{opacity:.55;}
  .mark{position:absolute;top:-14px;left:-10px;width:42px;height:42px;pointer-events:none;}
  .mark svg{width:100%;height:100%;}
  .mark .stroke{stroke:var(--shu);stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw .45s ease forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  @media (prefers-reduced-motion: reduce){.mark .stroke{animation:none;stroke-dashoffset:0;}}
  .verdict{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--shu);border:2px solid var(--shu);display:inline-block;padding:2px 16px;margin:6px 0 14px;letter-spacing:.2em;}
  .point-box{background:var(--marker-soft);border-left:4px solid var(--marker);padding:12px 14px;margin:4px 0 18px;}
  .point-box h3{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .point-box p{font-size:13.5px;line-height:1.9;text-align:justify;}
  .kaisetsu{border-top:2px solid var(--ink);padding-top:12px;margin-top:4px;}
  .kaisetsu h3{font-size:13px;letter-spacing:.2em;color:var(--sub);font-weight:600;margin-bottom:8px;}
  .kai-item{font-size:13.5px;line-height:1.8;margin-bottom:8px;padding-left:1.6em;text-indent:-1.6em;}
  .kai-item .ox{color:var(--shu);font-weight:700;margin-right:4px;}
  .next-bar{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));}
  .next-bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px;}
  .btn{flex:1;font-family:var(--sans);font-size:16px;padding:14px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;letter-spacing:.1em;}
  .btn.ghost{background:#fff;color:var(--ink);flex:0 0 auto;padding:14px 16px;}
  .btn:active{opacity:.8;}
  .result-circle{text-align:center;margin:34px 0 10px;}
  .result-circle .big{font-family:var(--serif);font-size:52px;font-weight:700;color:var(--shu);line-height:1;}
  .result-circle .big .small{font-size:20px;color:var(--ink);}
  .result-circle .cap{font-size:12px;color:var(--sub);letter-spacing:.15em;margin-top:6px;}
  .result-list{margin:22px 0;border-top:1px solid var(--line);}
  .result-row{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline;}
  .result-row .ox{font-family:var(--serif);font-weight:700;color:var(--shu);flex-shrink:0;width:1.4em;}
  .loading{text-align:center;color:var(--sub);font-size:13px;padding:60px 0;letter-spacing:.2em;}
  .hidden{display:none;}
  .care{background:#fff;border:1px solid var(--line);padding:11px 14px;margin:16px 0 0;font-size:12.5px;color:var(--sub);line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="exam-label">宅地建物取引士試験対策｜択一式トレーニング</div>
    <h1>宅建 全科目演習</h1>
    <span class="subject-tag">宅建業法18問＋権利関係10問</span>
  </header>

  <div id="screen-loading" class="loading">読み込み中…</div>

  <div id="screen-home" class="hidden">
    <div class="stats">
      <div class="stat"><div class="num" id="st-answered">0<span class="unit">問</span></div><div class="lbl">解答済み</div></div>
      <div class="stat"><div class="num" id="st-rate">–<span class="unit">%</span></div><div class="lbl">直近正答率</div></div>
      <div class="stat"><div class="num" id="st-wrong">0<span class="unit">問</span></div><div class="lbl">要復習</div></div>
    </div>
    <div id="cat-menu"></div>
    <button class="menu-btn" id="btn-review">間違えた問題だけ解く<span class="desc">全範囲から、直近で×だった問題を復習</span></button>
    <button class="menu-btn" id="btn-random">ランダムに5問<span class="desc">全範囲から。軽くひと回しに</span></button>
    <button class="reset-link" id="btn-reset">成績データをリセットする</button>
    <div class="care">無理のないペースで。今日は1〜2問でも十分です。調子が出ない日は閉じて休んでください。続きはいつでもここにあります。</div>
    <p class="note">本試験と同じ4肢択一形式です。問題はClaudeが作成した演習用オリジナル問題で、成績はこの端末のあなた専用データとして保存されます。</p>
  </div>

  <div id="screen-quiz" class="hidden">
    <div class="q-head">
      <div class="q-no" id="q-no">問 1</div>
      <div class="q-prog" id="q-prog">1 / 10</div>
    </div>
    <p class="q-text" id="q-text"></p>
    <ul class="choices" id="choices"></ul>
    <div id="feedback" class="hidden">
      <div class="verdict" id="verdict">正解</div>
      <div class="point-box"><h3>この問題のポイント</h3><p id="q-point"></p></div>
      <div class="kaisetsu"><h3>各肢の解説</h3><div id="kai-list"></div></div>
    </div>
  </div>

  <div id="screen-result" class="hidden">
    <div class="result-circle">
      <div class="big"><span id="r-correct">0</span><span class="small"> / <span id="r-total">10</span> 問正解</span></div>
      <div class="cap" id="r-cap">採点結果</div>
    </div>
    <div class="result-list" id="r-list"></div>
  </div>
</div>

<div class="next-bar hidden" id="next-bar">
  <div class="inner">
    <button class="btn ghost" id="btn-quit">中断</button>
    <button class="btn" id="btn-next">次の問題へ</button>
  </div>
</div>
<div class="next-bar hidden" id="result-bar">
  <div class="inner">
    <button class="btn ghost" id="btn-home2">ホームへ</button>
    <button class="btn" id="btn-retry-wrong">間違えた問題を解き直す</button>
  </div>
</div>

<script>
const QUESTIONS = [
{
 id:"tg01", title:"宅建業の定義",
 q:"宅地建物取引業の免許に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。",
 choices:[
  "自己所有の宅地を10区画に分割し、不特定多数の者に反復継続して分譲する場合は、宅地建物取引業の免許を受ける必要がある。",
  "自己所有のビル1棟を、自ら賃貸する事業を反復継続して行う場合は、宅地建物取引業の免許を受ける必要がある。",
  "他人の所有する建物の売買の媒介を1回だけ行う場合は、業として行うものではないため、いかなる場合も免許を受ける必要はない。",
  "国や地方公共団体から依頼を受けて宅地の売買の代理を業として行う場合は、免許を受ける必要はない。"
 ],
 answer:0,
 kai:[
  "正しい。宅地を不特定多数に反復継続して分譲（売買）するのは「宅地建物取引業」に当たり、免許が必要。",
  "誤り。自ら貸主として賃貸する行為（自ら賃貸）は、取引（売買・交換・媒介・代理）に当たらず、宅建業ではない。反復継続でも免許不要。最頻出のひっかけ。",
  "誤り。「業として」は反復継続性で判断するが、1回でも反復継続の意思があれば業に当たり得る。「1回だからいかなる場合も不要」と言い切る点が誤り。",
  "誤り。国・地方公共団体には宅建業法は適用されないが、その代理を業として行う者（民間業者）には免許が必要。"
 ],
 point:"宅建業＝〈宅地・建物〉の〈売買・交換〉または〈売買・交換・貸借の代理・媒介〉を〈業として〉行うこと。最大の急所は『自ら貸借（自ら賃貸・転貸）は宅建業ではない』点。大家業・サブリースは免許不要、と覚える。"
},
{
 id:"tg02", title:"免許の要否（自ら・代理・媒介）",
 q:"次の行為のうち、宅地建物取引業の免許を必要としないものはどれか。なお、いずれも業として行うものとする。",
 choices:[
  "自ら売主として、宅地を分譲する行為",
  "他人の建物の貸借の媒介を行う行為",
  "自ら貸主として、アパートを賃貸する行為",
  "他人の宅地の売買の代理を行う行為"
 ],
 answer:2,
 kai:[
  "誤り（免許必要）。自ら売主として宅地を売買するのは宅建業。",
  "誤り（免許必要）。貸借の媒介は宅建業に含まれる。",
  "正しい（免許不要）。自ら貸主として賃貸する『自ら貸借』は宅建業に当たらない。これがこの問題の答え。",
  "誤り（免許必要）。売買の代理は宅建業。"
 ],
 point:"取引の8類型を表で覚える。〈売買・交換〉は自ら・代理・媒介の3つとも宅建業。〈貸借〉は代理・媒介は宅建業だが『自ら貸借』だけが宅建業でない。表の右下1マスだけが免許不要、というイメージ。"
},
{
 id:"tg03", title:"事務所と専任宅建士",
 q:"宅地建物取引業者の事務所等に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。",
 choices:[
  "宅地建物取引業者は、その事務所ごとに、業務に従事する者5人に1人以上の割合で成年者である専任の宅地建物取引士を置かなければならない。",
  "専任の宅地建物取引士が退職して法定数を欠いた場合、宅地建物取引業者は1月以内に必要な措置を執らなければならない。",
  "宅地建物取引業者は、その事務所ごとに、公衆の見やすい場所に報酬の額を掲示する必要はない。",
  "案内所等で契約の締結等を行わない場所であっても、専任の宅地建物取引士を1人以上置かなければならない。"
 ],
 answer:0,
 kai:[
  "正しい。事務所では業務従事者5人に1人以上の専任宅建士の設置義務がある（業法31条の3）。",
  "誤り。法定数を欠いた場合は2週間以内に必要な措置を執らなければならない。1月以内ではない。",
  "誤り。事務所ごとに報酬額を公衆の見やすい場所に掲示する義務がある。",
  "誤り。専任宅建士の設置が必要な案内所等は『契約の締結または申込みの受付を行う』場所。契約等を行わない案内所には設置義務はない（1人以上必要なのは行う場合）。"
 ],
 point:"事務所の3点セット〈標識・報酬額の掲示・帳簿・従業者名簿〉＋〈専任宅建士5人に1人〉。欠員補充は2週間以内。案内所で専任宅建士が要るのは『契約・申込みを受ける』案内所だけ、という条件付きに注意。"
},
{
 id:"tg04", title:"免許の基準（欠格事由）",
 q:"宅地建物取引業の免許に関する次の記述のうち、宅地建物取引業法の規定によれば、免許を受けることができるものはどれか。",
 choices:[
  "破産手続開始の決定を受けて復権を得てから3年を経過しない者",
  "宅地建物取引業法に違反して罰金の刑に処せられ、その刑の執行を終わった日から5年を経過しない者",
  "禁錮以上の刑に処せられ、その刑の執行を終わった日から5年を経過しない者",
  "営業に関し成年者と同一の行為能力を有しない未成年者で、その法定代理人が宅地建物取引業法違反により罰金刑に処せられ、その執行を終えてから5年を経過しない者"
 ],
 answer:0,
 kai:[
  "正しい（免許可）。破産者は復権を得れば直ちに免許を受けられる。『復権から5年』のような期間制限はない。",
  "誤り（免許不可）。宅建業法違反による罰金刑は、執行終了等から5年を経過しないと免許を受けられない。",
  "誤り（免許不可）。禁錮以上の刑はすべて、刑の種類・罪名を問わず5年間欠格。",
  "誤り（免許不可）。成年者と同一の行為能力を有しない未成年者は、その法定代理人が欠格事由に該当する場合は本人も免許を受けられない。本肢の法定代理人は5年欠格中であり、未成年者本人も免許を受けられない。"
 ],
 point:"欠格事由は『5年』が基本ライン（禁錮以上、一定の罰金、免許不正取得等による取消し）。例外として破産者は『復権で即OK』、成年被後見人等は『要件に応じて個別判断』。破産＝復権で直ちに、を押さえると1肢切れる。"
},
{
 id:"tg05", title:"宅地建物取引士",
 q:"宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。",
 choices:[
  "宅地建物取引士証の有効期間は5年であり、更新を受けることができる。",
  "重要事項の説明をする際、相手方から請求がなければ宅地建物取引士証を提示する必要はない。",
  "宅地建物取引士の登録を受けるには、宅地建物取引士資格試験に合格し、かつ、5年以上の実務経験が必要である。",
  "宅地建物取引士証の交付を受けようとする者は、登録をしている都道府県知事が指定する講習で交付の申請前6月以内に行われるものを受講しなければならないが、試験合格後3年以内に交付を受ける場合はこの講習が不要である。"
 ],
 answer:0,
 kai:[
  "正しい。宅建士証の有効期間は5年で、更新できる。",
  "誤り。取引士証の提示は、重要事項の説明の際は相手方の請求がなくても必ず行わなければならない（取引の関係者から請求があったときも提示）。",
  "誤り。登録には2年以上の実務経験（または国土交通大臣の登録実務講習の修了）が必要。5年ではない。",
  "誤り。法定講習が不要となるのは試験合格後『1年以内』に交付を受ける場合。『3年以内』が誤り。前半（交付申請前6月以内の法定講習）は正しい。"
 ],
 point:"宅建士の3ステップ〈試験合格→登録（2年の実務経験 or 登録実務講習）→取引士証の交付（合格後1年超なら法定講習）〉。取引士証は5年更新。重説時の提示は『請求がなくても必須』が頻出。"
},
{
 id:"tg06", title:"営業保証金",
 q:"営業保証金に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。",
 choices:[
  "宅地建物取引業者は、主たる事務所について1,000万円、その他の事務所について事務所ごとに500万円の合計額の営業保証金を、それぞれの事務所の最寄りの供託所に供託しなければならない。",
  "営業保証金は、金銭による供託のみが認められ、有価証券で供託することはできない。",
  "宅地建物取引業者と宅地建物取引業に関し取引をした者は、その取引により生じた債権に関し、業者の従業員も含めて営業保証金から弁済を受ける権利を有する。",
  "宅地建物取引業者は、営業保証金を供託し、その旨を免許権者に届け出た後でなければ、その事業を開始してはならない。"
]
,
 answer:3,
 kai:[
  "誤り。金額（本店1,000万・支店各500万）は正しいが、供託先は『主たる事務所の最寄りの供託所』に一括して供託する。支店分も含めて本店最寄りの供託所にまとめる点が要で、『それぞれの事務所の最寄りの供託所』は誤り。",
  "誤り。営業保証金は金銭のほか、国債・地方債等の有価証券でも供託できる（評価額に一定の割合あり）。",
  "誤り。還付を受けられるのは『宅建業に関し取引をした者』だが、宅建業者（取引の相手方たる業者）や従業員の給与債権等は還付の対象外。『従業員も含めて』が誤り。",
  "正しい。営業保証金を供託し、その旨を免許権者に届け出た後でなければ事業を開始できない。"
 ],
 point:"営業保証金は〈本店1,000万・支店各500万〉を本店最寄りの供託所に〈金銭 or 有価証券〉で供託→届出後に開業。還付を受けられるのは『宅建業の取引から生じた債権を持つ者』で、宅建業者や従業員給与は対象外。保証協会（弁済業務保証金）との対比で覚える。"
},
{

const CATS = [
 {key:"tg", name:"宅建業法", short:"宅建業法"},
 {key:"tk", name:"権利関係", short:"権利関係"}
];
function catOf(q){ return CATS.find(c=>q.id.startsWith(c.key)); }

const STORE_KEY = "takken-quiz-v2";
let progress = {};
let session = null;
const hasClaudeStorage = (typeof window.storage !== "undefined") && window.storage && (typeof window.storage.get === "function");

async function loadProgress(){
  if(hasClaudeStorage){
    try{ const r = await window.storage.get(STORE_KEY); if(r && r.value) progress = JSON.parse(r.value); }catch(e){ progress = {}; }
  }else{
    try{ const v = localStorage.getItem(STORE_KEY); if(v) progress = JSON.parse(v); }catch(e){ progress = {}; }
  }
}
async function saveProgress(){
  if(hasClaudeStorage){
    try{ await window.storage.set(STORE_KEY, JSON.stringify(progress)); }catch(e){}
  }else{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){}
  }
}
async function deleteProgress(){
  if(hasClaudeStorage){ try{ await window.storage.delete(STORE_KEY); }catch(e){} }
  else{ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
}

const $ = id => document.getElementById(id);
function show(name){
  ["loading","home","quiz","result"].forEach(s=>{ $("screen-"+s).classList.toggle("hidden", s!==name); });
  $("next-bar").classList.add("hidden");
  $("result-bar").classList.toggle("hidden", name!=="result");
  window.scrollTo(0,0);
}
function wrongIndices(){
  return QUESTIONS.map((q,i)=>i).filter(i=>{ const p = progress[QUESTIONS[i].id]; return p && p.last === "x"; });
}
function renderHome(){
  const answered = QUESTIONS.filter(q=>progress[q.id]).length;
  const lastResults = QUESTIONS.map(q=>progress[q.id]).filter(Boolean);
  const lastCorrect = lastResults.filter(p=>p.last==="o").length;
  const rate = lastResults.length ? Math.round(lastCorrect/lastResults.length*100) : null;
  const wrongs = wrongIndices().length;
  $("st-answered").innerHTML = answered + '<span class="unit">問</span>';
  $("st-rate").innerHTML = (rate===null?"–":rate) + '<span class="unit">%</span>';
  $("st-wrong").innerHTML = wrongs + '<span class="unit">問</span>';
  $("btn-review").classList.toggle("disabled", wrongs===0);
  const menu = $("cat-menu");
  menu.innerHTML = "";
  CATS.forEach(cat=>{
    const list = QUESTIONS.filter(q=>q.id.startsWith(cat.key));
    const done = list.filter(q=>progress[q.id]).length;
    const ok = list.filter(q=>progress[q.id] && progress[q.id].last==="o").length;
    const btn = document.createElement("button");
    btn.className = "menu-btn";
    btn.innerHTML = cat.name + '<span class="desc">全'+list.length+'問　解答済み '+done+'問・直近○ '+ok+'問</span>';
    btn.addEventListener("click", ()=>startSession(list.map(q=>QUESTIONS.indexOf(q))));
    menu.appendChild(btn);
  });
  show("home");
}
function startSession(order){ session = {order, pos:0, results:[]}; renderQuestion(); show("quiz"); }
function renderQuestion(){
  const idx = session.order[session.pos];
  const q = QUESTIONS[idx];
  const perm = [0,1,2,3];
  for(let i=perm.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [perm[i],perm[j]]=[perm[j],perm[i]]; }
  session.perm = perm;
  const cat = catOf(q);
  const numInCat = QUESTIONS.filter(x=>x.id.startsWith(cat.key)).findIndex(x=>x.id===q.id) + 1;
  $("q-no").textContent = "問 " + numInCat + "　" + q.title;
  $("q-prog").textContent = cat.short + "　" + (session.pos+1) + " / " + session.order.length;
  $("q-text").textContent = q.q;
  $("feedback").classList.add("hidden");
  const ul = $("choices"); ul.innerHTML = "";
  const alphas = ["１","２","３","４"];
  perm.forEach((orig,i)=>{
    const li = document.createElement("li");
    li.className = "choice";
    li.innerHTML = '<span class="alpha">'+alphas[i]+'</span><span>'+q.choices[orig]+'</span>';
    li.addEventListener("click", ()=>pick(i));
    ul.appendChild(li);
  });
  $("next-bar").classList.add("hidden");
}
function markSVG(ok){
  const o = '<svg viewBox="0 0 48 48"><circle class="stroke" cx="24" cy="24" r="18" transform="rotate(-90 24 24)"/></svg>';
  const x = '<svg viewBox="0 0 48 48"><path class="stroke" d="M10 10 L38 38 M38 10 L10 38"/></svg>';
  return '<span class="mark">'+(ok?o:x)+'</span>';
}
async function pick(i){
  const idx = session.order[session.pos];
  const q = QUESTIONS[idx];
  const perm = session.perm;
  const ok = (perm[i] === q.answer);
  const correctPos = perm.indexOf(q.answer);
  [...$("choices").children].forEach((li)=>{ li.classList.add("locked","dim"); li.replaceWith(li.cloneNode(true)); });
  const fresh = [...$("choices").children];
  fresh[i].classList.add("picked"); fresh[i].classList.remove("dim");
  fresh[correctPos].classList.remove("dim");
  fresh[i].insertAdjacentHTML("afterbegin", markSVG(ok));
  if(!ok){ fresh[correctPos].insertAdjacentHTML("afterbegin", '<span class="mark" style="animation-delay:.2s"><svg viewBox="0 0 48 48"><circle class="stroke" cx="24" cy="24" r="18" transform="rotate(-90 24 24)"/></svg></span>'); }
  $("verdict").textContent = ok ? "正　解" : "不正解";
  $("q-point").textContent = q.point || "";
  const alphas = ["１","２","３","４"];
  $("kai-list").innerHTML = perm.map((orig,j)=> '<p class="kai-item"><b>'+alphas[j]+'</b>　<span class="ox">'+(orig===q.answer?"○":"×")+'</span>'+q.kai[orig]+'</p>').join("");
  $("feedback").classList.remove("hidden");
  session.results.push({idx, ok});
  const p = progress[q.id] || {c:0,w:0,last:null};
  if(ok){p.c++;}else{p.w++;}
  p.last = ok ? "o":"x";
  progress[q.id] = p;
  await saveProgress();
  $("btn-next").textContent = (session.pos === session.order.length-1) ? "採点結果を見る" : "次の問題へ";
  $("next-bar").classList.remove("hidden");
}
function nextQuestion(){ if(session.pos === session.order.length-1){ renderResult(); }else{ session.pos++; renderQuestion(); } }
function renderResult(){
  const total = session.results.length;
  const correct = session.results.filter(r=>r.ok).length;
  $("r-correct").textContent = correct; $("r-total").textContent = total;
  const rate = total? correct/total : 0;
  $("r-cap").textContent = rate===1 ? "全問正解！お見事" : rate>=0.7 ? "合格ライン水準。よい調子" : "解説を読めば十分。焦らずに";
  $("r-list").innerHTML = session.results.map(r=>{ const q = QUESTIONS[r.idx]; const cat=catOf(q); const numInCat = QUESTIONS.filter(x=>x.id.startsWith(cat.key)).findIndex(x=>x.id===q.id)+1; return '<div class="result-row"><span class="ox">'+(r.ok?"○":"×")+'</span><span>'+cat.short+'　問'+numInCat+'　'+q.title+'</span></div>'; }).join("");
  $("btn-retry-wrong").style.display = session.results.some(r=>!r.ok) ? "" : "none";
  show("result");
}
$("btn-review").addEventListener("click", ()=>{ const w = wrongIndices(); if(w.length) startSession(w); });
$("btn-random").addEventListener("click", ()=>{
  const idxs = QUESTIONS.map((_,i)=>i);
  for(let i=idxs.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [idxs[i],idxs[j]]=[idxs[j],idxs[i]]; }
  startSession(idxs.slice(0,5));
});
$("btn-reset").addEventListener("click", async ()=>{ if(confirm("成績データをリセットします。よろしいですか？")){ progress = {}; await deleteProgress(); renderHome(); } });
$("btn-next").addEventListener("click", nextQuestion);
$("btn-quit").addEventListener("click", renderHome);
$("btn-home2").addEventListener("click", renderHome);
$("btn-retry-wrong").addEventListener("click", ()=>{ const w = session.results.filter(r=>!r.ok).map(r=>r.idx); if(w.length) startSession(w); else renderHome(); });
(async function init(){ await loadProgress(); renderHome(); })();
</script>
